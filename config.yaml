# Configurazione Globale Pipeline Sismica

project:
  name: "Pipeline Sismologica Geospaziale"
  environment: "development"   # development | test | production

paths:
  data_raw: "data/raw"
  data_interim: "data/interim"
  data_processed: "data/processed"
  runs_dir: "runs"
  models_dir: "mobile/models"
  registry_dir: "models/registry"
  mlruns_dir: "mlruns"

geospatial:
  epsg: 32633                    # Sistema di proiezione UTM 33N
  surface_elevation_m: 0.0       # Quota stimata di default (livello del mare)

inversion:
  guess_velocity_m_s: 4000.0     # Velocità iniziale (m/s)
  velocity_min_m_s: 1500.0
  velocity_max_m_s: 7000.0
  min_events_per_station: 8
  travel_time_min_s: 0.05
  travel_time_max_s: 120.0
  margin_km: 15.0                # Margine bounding box (km)

mapping:
  grid_points: 400               # Risoluzione interpolazione
  contour_levels: 8
  default_anomaly_threshold: 0.5

fdsn:
  client: "INGV"
  network: "IV"
  # Lista di stazioni di default (es. Campi Flegrei). Puoi cambiarla o usare file esterni.
  stations: [
    "CAAM", "CAFL", "CAWE", "CBAC", "CBAG", "CCAP", "CFMN", "CMIS", "CMSN",
    "CMTS", "CNIS", "COLB", "CPIS", "CPOZ", "CQUE", "CSFT", "CSOB", "CSTH",
    "CUMA", "IBCM", "IBRN", "IOCA", "IPSM", "PTMR"
  ]
  channels: ["HHZ", "HHN", "HHE", "EHZ", "EHN", "EHE"]
  output_dir: "data/raw/waveforms"

monitoring:
  enabled: true
  output_csv: "data/processed/station_stats.csv"
  output_spatial_csv: "data/processed/deltas_spatial.csv"
  min_records_for_alert: 10

alerts:
  enabled: true
  output_csv: "mobile/alerts/alerts_log.csv"
  output_jsonl: "mobile/alerts/alerts_log.jsonl"
  cooldown_minutes: 60
  thresholds:
    low: 0.30
    medium: 0.60
    high: 0.80
    critical: 0.95

mobile:
  config:
    alert: "mobile/config/alert_config.yaml"
    monitor: "mobile/config/monitor_config.yaml"
    retraining: "mobile/config/retraining_config.yaml"