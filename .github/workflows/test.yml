name: Test, Lint, Format, and Train

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      
      - name: Linting and Formatting Check
        run: |
          # Controlla la formattazione con Black
          black . --check
          # Controlla l'ordinamento degli import con isort
          isort . --check-only --profile black
          # Controlla lo stile con flake8
          flake8 .
      
      - name: Test with pytest and coverage
        run: |
          pytest --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: true

  train:
    # Esegue il training solo se il job 'test' ha successo
    needs: test
    runs-on: ubuntu-latest
    # Esegui questo job solo per push/merge sul branch main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,ml]
      - name: Run training script
        run: |
          # Crea una directory per i modelli di CI
          mkdir -p models/ci
          # Esegue lo script di training
          python scripts/train_risk_model.py --model-output-dir models/ci --model-type xgboost
      - name: Upload trained model as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-ci
          path: models/ci/
