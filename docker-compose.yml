services:
  db_geospaziale:
    image: postgis/postgis:15-3.3
    container_name: sismologia_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Retraining automatico mensile (issue #7): cron interno esegue
  # `python -m mobile.retrain_models --force` il giorno 1 alle 03:00.
  # Il codice è montato come volume: modelli (mobile/models/), run
  # (runs/retraining/) e log restano sull'host e sopravvivono al container.
  retraining:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sismologia_retraining
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgis_data: