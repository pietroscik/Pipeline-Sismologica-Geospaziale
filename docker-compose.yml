
services:
  db_geospaziale:
    image: postgis/postgis:15-3.3
    container_name: sismologia_postgis
    environment:
      POSTGRES_USER: sismologia_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: sismologia_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgis_data:
