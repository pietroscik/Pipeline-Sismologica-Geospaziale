[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-sismologica-geospaziale"
version = "0.1.0"
description = "Pipeline Python per analisi sismologica geospaziale"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pietro Maietta", email = "pietroscik@gmail.com"}
]
keywords = ["sismologia", "geospaziale", "pipeline", "gis", "fdsn", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "obspy>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyproj>=3.4.0",
    "geopandas>=0.12.0",
    "rasterio>=1.3.0",
    "pyyaml>=6.0",
    "shapely>=2.0.0",
    "contextily>=1.3.0",
    "streamlit>=1.28.0",
    "folium>=0.14.0",
    "streamlit-folium>=0.11.0",
    "requests>=2.28.0",
    "scikit-learn>=1.0.0",
    "joblib>=1.2.0",
    "mlflow>=2.0.0",
    "plotly>=5.0.0",
    "cryptography>=3.4.8",
    "python-dotenv>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.0",
    "black>=23.0",
    "isort>=5.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]
sms = [
    "twilio>=8.0.0",
]
ml = [
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "imbalanced-learn>=0.10.0",
    "xgboost>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale"
Documentation = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale#readme"
Repository = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale.git"
Issues = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.flake8]
max-line-length = 88
exclude = ["venv", ".venv", ".git", "__pycache__", "build", "dist"]
ignore = ["E203", "W503"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short --cov=scripts --cov=mobile --cov-report=term-missing"
