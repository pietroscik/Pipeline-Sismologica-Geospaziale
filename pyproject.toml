[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-sismologica-geospaziale"
version = "0.1.0"
description = "Pipeline Python per analisi sismologica geospaziale"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Pietro Maietta", email = "pietroscik@gmail.com"}
]
keywords = ["sismologia", "geospaziale", "pipeline", "gis", "fdsn", "streamlit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "obspy",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "pyproj",
    "geopandas",
    "rasterio",
    "pyyaml",
    "shapely",
    "contextily",
    "streamlit",
    "folium",
    "streamlit-folium",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale"
Documentation = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale#readme"
Repository = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale.git"
Issues = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311"]

[tool.flake8]
max-line-length = 88
exclude = ["venv/*", ".git/*", "__pycache__/*"]
ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"