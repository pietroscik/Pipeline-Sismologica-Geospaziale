[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-sismologica-geospaziale"
version = "1.0.0"
description = "Pipeline Python per analisi sismologica geospaziale e mobile"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Pietro Maietta", email = "pietroscik@gmail.com"}
]
keywords = ["sismologia", "geospaziale", "pipeline", "gis", "fdsn", "streamlit", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # Core & Geospaziale
    "obspy",
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "pyproj",
    "geopandas",
    "rasterio",
    "pyyaml",
    "shapely",
    "contextily",
    "requests",
    
    # UI & Dashboard
    "streamlit",
    "folium",
    "streamlit-folium",
    "plotly>=5.0.0",
    
    # Machine Learning
    "scikit-learn>=1.0.0",
    "xgboost",
    "joblib>=1.2.0",
    "torch",
    "torch_geometric",
    "imblearn",
    "mlflow>=2.0.0",
    
    # Cloud & API & Database (Aggiunte mancanti per moduli mobile/api)
    "boto3>=1.26.0",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "geoalchemy2",
    "python-json-logger",
    "python-dotenv",
    
    # Testing & Development
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",

    #Data Handling
    "h5py",
    "netCDF4",

    #PostgreSQL
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-mock",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
]
sms = [
    "twilio>=8.0.0",
]
ml = [
    "torch>=2.0.0",
    "torch_geometric>=2.3.0",
    "imbalanced-learn>=0.10.0",
    "xgboost>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale"
Repository = "https://github.com/pietroscik/Pipeline-Sismologica-Geospaziale.git"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]

[tool.flake8]
max-line-length = 88
exclude = ["venv/*", ".git/*", "__pycache__/*"]
ignore = ["E203", "W503"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_mode = 3

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=mobile --cov=path_utils --cov-report=term-missing --cov-report=html --cov-fail-under=80"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests"
]