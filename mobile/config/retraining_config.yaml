# Configurazione operativa del retraining automatico (issue #7).
# Usata da mobile/retrain_models.py (orchestratore) - vedi anche il servizio
# Docker "retraining" in docker-compose.yml (retraining mensile via cron).

retraining:
  enabled: true
  schedule: "monthly"             # coerente con il cron del container (giorno 1, 03:00)
  interval_seconds: 2592000       # 30 giorni (trigger temporale per la modalità --continuous)
  min_new_samples: 1000           # nuovi campioni necessari per il trigger dati
  performance_threshold: 0.70     # R2 minimo per il deploy; 0.85 era troppo severo per dati sismici
  models_to_retrain:              # modelli riaddestrati a ogni ciclo
    - xgboost                     # in retrain_models: GradientBoostingRegressor
    - random_forest
  cross_validation_folds: 5
  test_size: 0.2

data:
  input_dir: examples/mobile_devices
  input_file: scoperte_automatiche.csv.gz
  min_samples: 1000

# Notifiche: la classe FallbackAlertSystem supporta console/file;
# i canali esterni (slack/email) richiedono l'adapter di mobile.alert_system
notification:
  enabled: true
  channels: ["console", "file"]
  success: true
  failure: true

logging:
  level: INFO
  file: logs/retraining.log
