# Config base (fallback)

email_enabled: false
webhook_enabled: false
sms_enabled: false
telegram_enabled: false

# Soglie rischio allineate a config.yaml
thresholds:
  low: 0.30
  medium: 0.60
  high: 0.80
  critical: 0.95

# Cooldown minuti
alert_cooldown_minutes: 60

# Email (placeholder, senza credenziali reali)
email_smtp: "smtp.gmail.com"
email_port: 587
email_user: ""
email_password: ""
email_to: []

# Webhook
webhook_url: ""
webhook_timeout_seconds: 10

# SMS (Twilio)
sms_account_sid: ""
sms_auth_token: ""
sms_from: ""
sms_to: []

# Telegram
telegram_bot_token: ""
telegram_chat_id: ""

# Cifratura opzionale (meglio via ENV ENCRYPTION_KEY)
encryption_key: ""
